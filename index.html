<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videy Player</title>
    
    <style>
        /* Reset dan background gelap */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }

        /* --- STYLING HALAMAN UTAMA (SPLASH SCREEN) --- */
        #splashScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .continue-text {
            font-size: 22px;
            font-weight: bold; /* Teks tebal */
            text-transform: uppercase; /* Huruf kapital semua */
            background-color: #ffe600; /* Background kuning */
            color: #ff0000; /* Teks merah */
            cursor: pointer;
            text-decoration: none;
            padding: 20px 40px;
            border-radius: 12px; /* Sudut melengkung */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            user-select: none;
            box-shadow: 0 5px 20px rgba(255, 230, 0, 0.2); /* Efek cahaya kuning di belakangnya */
            text-align: center;
        }

        .continue-text:hover {
            transform: scale(1.05); /* Membesar sedikit saat diarahkan kursor */
            box-shadow: 0 8px 25px rgba(255, 230, 0, 0.4);
        }

        /* --- STYLING VIDEO PLAYER --- */
        #playerScreen {
            display: none; /* Disembunyikan sampai teks diklik */
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            z-index: 5;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .input-box input {
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #333;
            background-color: #1a1a1a;
            color: #fff;
            width: 60%;
            outline: none;
            font-size: 14px;
        }

        .input-box button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background-color: #2563eb;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-box button:hover {
            background-color: #1d4ed8;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        video {
            width: 100%;
            max-height: 80vh;
            display: block;
            outline: none;
        }

        .action-bar {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-id-text {
            font-size: 14px;
            color: #888;
        }

        .btn {
            background-color: #272727;
            color: #fff;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            transition: background-color 0.2s;
            display: inline-block;
        }

        .btn:hover {
            background-color: #3f3f3f;
        }
    </style>
</head>
<body>

    <!-- HALAMAN UTAMA (Tombol Teks) -->
    <div id="splashScreen">
        <span class="continue-text" onclick="showPlayer()">Lanjutkan untuk menonton tanpa iklan</span>
    </div>

    <!-- HALAMAN PLAYER (Awalnya Tersembunyi) -->
    <div id="playerScreen">
        
        <!-- Form input jika tidak ada ID di URL -->
        <div class="input-box" id="inputForm">
            <input type="text" id="videyInput" placeholder="Masukkan ID Videy (contoh: ANdnV2BS1)">
            <button onclick="loadVideoFromInput()">Tonton</button>
        </div>

        <!-- Video Player -->
        <div class="video-wrapper">
            <video id="videoPlayer" controls playsinline preload="metadata">
                Browser Anda tidak mendukung HTML5 video.
            </video>
        </div>

        <!-- Tombol Aksi -->
        <div class="action-bar" id="actionBar" style="display: none;">
            <span class="video-id-text" id="videoTitle">ID: -</span>
            <a id="downloadBtn" href="#" download class="btn" target="_blank">Download Video</a>
        </div>

    </div>

    <script>
        let currentVideoId = null;

        function getVideoIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            let id = urlParams.get('id');

            if (!id && window.location.hash) {
                id = window.location.hash.substring(1);
            }
            return id;
        }

        function showPlayer() {
            document.getElementById('splashScreen').style.display = 'none';
            document.getElementById('playerScreen').style.display = 'block';

            if (currentVideoId) {
                playVideo(currentVideoId);
            }
        }

        function playVideo(id) {
            if (!id) return;

            id = id.replace('https://cdn.videy.co/', '')
                   .replace('https://videy.co/v?id=', '')
                   .replace('.mp4', '')
                   .trim();

            const cdnUrl = `https://cdn.videy.co/${id}.mp4`;
            const videoPlayer = document.getElementById('videoPlayer');
            
            videoPlayer.src = cdnUrl;
            document.getElementById('downloadBtn').href = cdnUrl;
            document.getElementById('videoTitle').innerText = `ID: ${id}`;
            document.getElementById('actionBar').style.display = 'flex';

            videoPlayer.load();
            videoPlayer.play().catch(e => {
                console.log("Autoplay diblokir. Putar manual.");
            });
        }

        function loadVideoFromInput() {
            const inputVal = document.getElementById('videyInput').value;
            if (inputVal) {
                const cleanId = inputVal.replace('https://cdn.videy.co/', '').replace('.mp4', '').trim();
                window.history.pushState({}, '', `?id=${cleanId}`);
                playVideo(cleanId);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            currentVideoId = getVideoIdFromUrl();
        });
    </script>
</body>
</html>
